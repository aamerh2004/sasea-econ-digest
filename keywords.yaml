# Country name variants used to detect relevance, and the finance/econ/
# trade/FX/development terms that must co-occur (for feeds that aren't
# already country/topic-scoped by their URL).
# Keep these unambiguous. "rupee" is shared by India, Pakistan, Nepal and
# Sri Lanka, and "male" (the Maldivian capital) collides with the ordinary
# English word — both caused misfiled stories, so neither is used.
countries:
  Bangladesh: ["bangladesh", "bangladeshi", "dhaka", "taka", "bangladesh bank"]
  Pakistan: ["pakistan", "pakistani", "islamabad", "karachi", "lahore", "state bank of pakistan"]
  Afghanistan: ["afghanistan", "afghan", "kabul", "afghani"]
  Nepal: ["nepal", "nepali", "nepalese", "kathmandu"]
  Bhutan: ["bhutan", "bhutanese", "thimphu", "ngultrum"]
  Maldives: ["maldives", "maldivian", "rufiyaa"]
  Philippines: ["philippines", "philippine", "filipino", "manila", "bangko sentral"]

# Feed ids where relevance is already guaranteed by the source itself
# (a dedicated country outlet) — topic filtering is still applied, but
# country filtering is skipped since everything on the feed already is
# about that country.
local_feed_countries:
  khaama: Afghanistan
  ariananews: Afghanistan
  amu-tv: Afghanistan
  dawn-business: Pakistan
  brecorder: Pakistan
  daily-star-business: Bangladesh
  dhaka-tribune: Bangladesh
  kathmandu-post-money: Nepal
  inquirer-business: Philippines
  bworldonline: Philippines
  rappler-business: Philippines
  tolonews: Afghanistan

# Countries whose coverage is framed in aid, sanctions, and humanitarian
# financing terms that the economics keyword list below tends to miss.
# A country match alone is enough to include these.
topic_exempt_countries:
  - Afghanistan

