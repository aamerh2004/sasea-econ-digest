name: Daily digest

on:
  schedule:
    # ~6am US Eastern. GitHub Actions cron is fixed UTC, so this drifts
    # by about an hour around the March/November DST changeovers.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build digest, render site, send email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/run_daily.py --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Commit and push updated digest + site
        run: |
          git config user.name "sasea-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/digests docs
          git diff --staged --quiet || git commit -m "Daily digest $(date -u +%Y-%m-%d)"
          git push
