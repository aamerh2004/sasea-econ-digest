# RSS sources for the South & Southeast Asia Economic Digest.
# type: global | thinktank | local
# tier: relative weight used when ranking "Today's Top Developments" (3 = highest)
# require_topic: false means a country match alone is enough to include the
#   story — used for major global papers, which cover these countries rarely
#   enough that anything they do publish is worth surfacing.
sources:
  # --- Global / major outlets ---
  - id: nyt-world
    name: "The New York Times — World"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
    type: global
    tier: 3
    require_topic: false
  - id: nyt-business
    name: "The New York Times — Business"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml"
    type: global
    tier: 3
    require_topic: false
  - id: nyt-asia
    name: "The New York Times — Asia Pacific"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/AsiaPacific.xml"
    type: global
    tier: 3
    require_topic: false
  - id: nyt-economy
    name: "The New York Times — Economy"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml"
    type: global
    tier: 3
    require_topic: false
  - id: ft-world
    name: "Financial Times — World"
    url: "https://www.ft.com/world?format=rss"
    type: global
    tier: 3
    require_topic: false
  - id: ft-asia
    name: "Financial Times — Asia Pacific"
    url: "https://www.ft.com/world/asia-pacific?format=rss"
    type: global
    tier: 3
    require_topic: false
  - id: ft-global-economy
    name: "Financial Times — Global Economy"
    url: "https://www.ft.com/global-economy?format=rss"
    type: global
    tier: 3
    require_topic: false
  - id: wsj-world
    name: "WSJ — World News"
    url: "https://feeds.a.dj.com/rss/RSSWorldNews.xml"
    type: global
    tier: 3
    require_topic: false
  - id: wsj-markets
    name: "WSJ — Markets"
    url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"
    type: global
    tier: 3
    require_topic: false
  - id: economist-finance
    name: "The Economist — Finance & Economics"
    url: "https://www.economist.com/finance-and-economics/rss.xml"
    type: global
    tier: 3
    require_topic: false
  - id: economist-asia
    name: "The Economist — Asia"
    url: "https://www.economist.com/asia/rss.xml"
    type: global
    tier: 3
    require_topic: false
  - id: bbc-business
    name: "BBC — Business"
    url: "http://feeds.bbci.co.uk/news/business/rss.xml"
    type: global
    tier: 2
  - id: bbc-asia
    name: "BBC — Asia"
    url: "http://feeds.bbci.co.uk/news/world/asia/rss.xml"
    type: global
    tier: 2
  - id: aljazeera-all
    name: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    type: global
    tier: 2
  - id: guardian-business
    name: "The Guardian — Business"
    url: "https://www.theguardian.com/uk/business/rss"
    type: global
    tier: 2
  - id: guardian-asia
    name: "The Guardian — Asia"
    url: "https://www.theguardian.com/world/asia/rss"
    type: global
    tier: 2
  - id: scmp-asia
    name: "South China Morning Post — Asia"
    url: "https://www.scmp.com/rss/318208/feed"
    type: global
    tier: 2
  - id: nikkei-asia
    name: "Nikkei Asia"
    url: "https://asia.nikkei.com/rss/feed/nar"
    type: global
    tier: 3
  - id: the-diplomat
    name: "The Diplomat"
    url: "https://thediplomat.com/feed/"
    type: global
    tier: 2
  - id: foreign-policy
    name: "Foreign Policy"
    url: "https://foreignpolicy.com/feed/"
    type: global
    tier: 2

  # --- Think tanks / multilaterals ---
  # Note: Brookings, PIIE, Carnegie, IMF, World Bank, Wilson Center, and ORF
  # no longer publish working public RSS feeds (verified during setup) and
  # were dropped rather than included broken. Re-check periodically.
  - id: csis
    name: "CSIS"
    url: "https://www.csis.org/rss.xml"
    type: thinktank
    tier: 2
  - id: atlantic-council
    name: "Atlantic Council"
    url: "https://www.atlanticcouncil.org/feed/"
    type: thinktank
    tier: 2
  - id: adb-news
